[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge-rl"
version = "4.0.0"
description = "Cybersecurity gym for reinforcement learning"
authors = [
    { name = "Igor Jankowski", email = "igorjankowwski@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "reinforcement-learning",
    "multi-agent",
    "cybersecurity",
    "pettingzoo",
    "gymnasium",
    "benchmark",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.4.0",
    "gymnasium>=1.2.2",
    "pettingzoo>=1.26.1",
    "networkx>=3.4.0",
    "pyyaml>=6.0.2",
    "stable-baselines3>=2.9.0",
    "scikit-learn>=1.0.0",
    "pillow>=10.0.0"
]

[project.optional-dependencies]
rllib = [
    "ray[rllib]>=2.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "tensorboard>=2.17.0",
    "ruff>=0.3.0",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinxcontrib-mermaid>=1.0.0",
]
jax = [
    "jax[cpu]>=0.10.0",
]
render = [
    "matplotlib>=3.8.0",
    "networkx>=3.2.1",
    "moviepy>=2.0.0",
]
finetune = [
    "torch>=2.12.0",
    "transformers>=5.12.0",
    "trl>=0.9.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.33.0",
]
pcap = [
    "scapy>=2.5.0",
]
docker_bridge = [
    "docker>=7.0.0",
]
nlp = [
    "sentence-transformers>=2.7.0",
]
llm_clients = [
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "google-generativeai>=0.7.0",
]
offline = [
    "minari>=0.5.0",
    "h5py>=3.10.0",
]

[project.scripts]
netforge = "netforge_rl.cli:main"

[project.urls]
Homepage = "https://github.com/reforcemind/NetForge_RL"
Documentation = "https://reforcemind.github.io/NetForge_RL/"
Issues = "https://github.com/reforcemind/NetForge_RL/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: Mark pure unit tests (< 50ms)",
    "integration: Mark multi-component tests",
    "slow: Mark full env/encoder loops (> 3s)"
]

[tool.ruff]
line-length = 88

target-version = "py312"

[tool.ruff.format]
quote-style = "single"

indent-style = "space"

skip-magic-trailing-comma = false

docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"netforge_rl/semantic/clients/*.py" = ["F401"]
"netforge_rl/render/replay_html.py" = ["E501"]
[tool.ruff.lint]
ignore = ["E701", "E402", "E702"]

[tool.setuptools.packages.find]
include = ["netforge_rl*", "netforge"]

[tool.setuptools.package-data]
netforge_rl = ["scenarios/packs/*.yaml"]
